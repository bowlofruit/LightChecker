name: Update Schedules

on:
  schedule:
    # Every hour at minute 5 (UTC) — covers Ukraine peak hours
    - cron: '5 * * * *'
  workflow_dispatch: # Manual trigger

# Never let two ingestion runs (scheduled + manual, or an overrunning hour) write
# Firestore concurrently — serialize, don't cancel an in-flight write.
concurrency:
  group: update-schedules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Match the deployed Functions runtime (Node 20).
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: LightChecker/functions/package-lock.json

      - name: Install dependencies
        working-directory: LightChecker/functions
        run: npm ci

      - name: Build TypeScript
        working-directory: LightChecker/functions
        run: npx tsc

      - name: Write Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        # printf via env indirection: no log exposure, and robust to quotes in the JSON.
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json

      - name: Run schedule update
        working-directory: LightChecker/functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: node scripts/populate-firestore.cjs

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
