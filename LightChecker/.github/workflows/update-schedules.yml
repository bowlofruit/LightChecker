name: Update Schedules

on:
  schedule:
    # Every hour at minute 5 (UTC) — covers Ukraine peak hours
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      force_lviv:
        description: Пересканувати Львів (OCR), навіть якщо пости не змінились
        required: false
        default: false
        type: boolean

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Build TypeScript
        working-directory: functions
        run: npx tsc

      - name: Write Firebase credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-sa.json

      - name: Run schedule update
        working-directory: functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: |
          ARGS=()
          if [ "${{ github.event.inputs.force_lviv }}" = "true" ]; then
            ARGS+=(--force-lviv)
          fi
          node scripts/populate-firestore.cjs "${ARGS[@]}"

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/firebase-sa.json
